name: CI
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun run test

  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  compiler-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build the sandbox image
        run: docker build -f services/compiler/sandbox/Dockerfile -t esp32-sim-sandbox:dev .
      - name: Sandbox integration tests (real Docker)
        working-directory: services/compiler
        run: COMPILER_IT=1 go test -count=1 -run Integration -v ./...
